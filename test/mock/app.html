<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-plugin-select-quote-with-edit · mock host</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #1d1e20;
    color: #ececee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 22px;
    -webkit-font-smoothing: antialiased;
  }
  body { --dsw-menu-surface-fill: rgba(42, 43, 46, 0.94); --dsw-menu-backdrop-filter: blur(40px) saturate(150%); }
  .ds-app { min-height: 100vh; }
  .ds-stream {
    width: 760px;
    margin: 0 auto;
    padding: 28px 0 170px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ds-assistant { line-height: 24px; margin: 10px 0; user-select: text; }
  .ds-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(127, 127, 127, 0.18);
  }
  .ds-userRow { display: flex; flex-direction: column; align-items: flex-end; margin: 8px 0; }
  .ds-bubble {
    max-width: 76%;
    padding: 10px 16px;
    border-radius: 22px;
    background: #37383c;
    color: #ececee;
    line-height: 22px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    user-select: text;
  }
  .ds-actions { display: flex; align-items: center; gap: 8px; height: 28px; }
  .ds-time { padding-right: 12px; font-size: 13px; color: #a3a7ad; white-space: nowrap; }
  .ds-action {
    appearance: none; border: 0; padding: 6px; width: 28px; height: 28px;
    border-radius: 6px; background: transparent; color: #a3a7ad; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ds-action:hover { background: rgba(127, 127, 127, 0.16); color: #ececee; }
  .ds-bubbleRow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ds-chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 9px;
    background: rgba(127, 127, 127, 0.2);
    border: 0.5px solid rgba(255, 255, 255, 0.14);
    color: #d4d6da;
    font-size: 12px;
    line-height: 17px;
  }
  .ds-composerWrap { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; }
  .ds-composerCard {
    position: relative;
    width: 760px;
    border-radius: 22px;
    background: #26272a;
    box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.07), 0 8px 28px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
  }
  .ds-editor { min-height: 24px; padding: 12px 16px 6px; outline: none; user-select: text; }
  .ds-editor:empty::before { content: attr(data-placeholder); color: #7c8085; }
  .ds-composerRow { display: flex; align-items: center; gap: 10px; padding: 6px 12px 12px; }
  .ds-iconBtn, .ds-modeBtn, .ds-modelBtn {
    appearance: none; border: 0; background: transparent; color: #c9cbd0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 13px;
    padding: 4px 6px; border-radius: 8px;
  }
  .ds-modeBtn { color: #dd8629; }
  .ds-iconBtn:hover, .ds-modeBtn:hover, .ds-modelBtn:hover { background: rgba(127, 127, 127, 0.16); }
  .ds-send {
    appearance: none; border: 0; width: 32px; height: 32px; border-radius: 50%;
    background: #ffffff; color: #16171a; display: grid; place-items: center; cursor: pointer;
  }
  .ds-error {
    margin: 40px auto; width: 560px; padding: 16px; border-radius: 12px;
    background: #5b2027; color: #ffd9dd; font-size: 13px;
  }
</style>
</head>
<body data-ds-dark-theme="true">
  <div id="root"></div>
  <script>
    window.__errors = [];
    window.addEventListener('error', (event) => {
      window.__errors.push(String((event && event.error) || event.message));
    });
    window.addEventListener('unhandledrejection', (event) => {
      window.__errors.push('rejection: ' + String(event.reason));
    });
  </script>
  <script src="./mock-host.js"></script>
  <script src="../../lib/client.js"></script>
  <script>
    /*
     * Harness hook (mock only): ?autoclick=1 clicks the first decorated file link
     * after the decorator settles and dumps what the plugin handed to
     * `betterSidebar.openFile` into the DOM, so a headless `--dump-dom` run can
     * assert the click path end to end.
     */
    var wantsClick = location.search.indexOf('autoclick=1') !== -1;
    var wantsProbe = location.search.indexOf('probe=1') !== -1;
    var wantsSyncProbe = location.search.indexOf('syncprobe=1') !== -1;
    if (wantsSyncProbe) {
      /*
       * 回归探针（mock only）：把「发送瞬间」那一帧复现出来 —— 往流里插一行带长
       * 路径的用户消息，然后在**同一个任务的微任务里**（MutationObserver 跑完、
       * 浏览器还没绘制）看胶囊是否已经就位。旧的 120ms 去抖在这里必然是 false。
       */
      (function () {
        var path = '/Users/bu/WorkBuddy/2026-11-02-14-55-10/dsh-plugin-select-quote-with-edit/src/client/mention-decorate.ts';
        var row = document.createElement('div');
        row.setAttribute('data-chat-flow-kind', 'user');
        row.setAttribute('data-submission-echo', '');
        row.textContent = '看下 @' + path + ' 这段';
        var result = { microtaskChip: false, chipName: null, rawTextLeft: null };
        document.body.appendChild(row);
        Promise.resolve().then(function () {
          var chip = row.querySelector('[data-dsqe-filechip]');
          result.microtaskChip = chip !== null;
          var name = chip && chip.querySelector('.dsqe_fileChipName');
          result.chipName = name ? name.textContent : null;
          result.rawTextLeft = (row.textContent || '').indexOf(path) !== -1;
          var out = document.createElement('pre');
          out.id = 'dsqe-syncprobe';
          out.textContent = JSON.stringify(result);
          document.body.appendChild(out);
        });
      })();
    }
    if (wantsClick || wantsProbe) {
      setTimeout(function () {
        if (wantsClick) {
          var link = document.querySelector('[data-dsqe-filelink]');
          if (link) link.click();
          var clicked = document.createElement('pre');
          clicked.id = 'dsqe-click-result';
          clicked.textContent = JSON.stringify(window.__dsqeOpenFile || null);
          document.body.appendChild(clicked);
        }
        if (wantsProbe) {
          var probe = {
            links: Array.prototype.map.call(
              document.querySelectorAll('[data-dsqe-filelink]'),
              function (el) { return el.getAttribute('data-dsqe-path'); }
            ),
            plainHomeHtml: !!Array.prototype.slice
              .call(document.querySelectorAll('[data-chat-flow-key]'))
              .map(function (row) { return row.textContent || ''; })
              .join('\n')
              .match(/不存在的 home\.html/),
            chips: Array.prototype.map.call(
              document.querySelectorAll('[data-dsqe-filechip]'),
              function (chip) {
                var bubble = chip.closest('.dsqe-bubble') || chip.closest('[data-chat-flow-kind="user"]');
                var name = chip.querySelector('.dsqe_fileChipName');
                var cr = chip.getBoundingClientRect();
                var br = bubble ? bubble.getBoundingClientRect() : null;
                return {
                  text: (name ? name.textContent : '').slice(0, 18),
                  chipW: Math.round(cr.width),
                  overflowRight: br ? Math.round(cr.right - br.right) : null,
                  ellipsis: name ? name.scrollWidth > name.clientWidth + 1 : null,
                  bubbleScrolls: bubble ? bubble.scrollWidth > bubble.clientWidth + 1 : null
                };
              }
            ),
            tables: Array.prototype.map.call(
              document.querySelectorAll('.md-table-wide'),
              function (wrapper) {
                var table = wrapper.querySelector('table');
                return {
                  wrapperClient: wrapper.clientWidth,
                  wrapperScroll: wrapper.scrollWidth,
                  tableWidth: table ? Math.round(table.getBoundingClientRect().width) : 0,
                  overflowX: getComputedStyle(wrapper).overflowX,
                  applied: wrapper.getAttribute('data-dsqe-table-width'),
                  scrollLeft: wrapper.scrollLeft
                };
              }
            )
          };
          var out = document.createElement('pre');
          out.id = 'dsqe-probe';
          out.textContent = JSON.stringify(probe);
          document.body.appendChild(out);
        }
      }, 3000);
    }
  </script>
</body>
</html>
